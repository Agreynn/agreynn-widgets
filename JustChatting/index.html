<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Agreynn - Just Chatting</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="overlay">

        <!-- Decoración superior -->
        <header class="top-bar">

            <div class="top-line"></div>

            <div class="channel-name">
                <span class="small-title">EL NIDO DE</span>
                <h1>AGREYNN</h1>
                <span class="mode-title">JUST CHATTING</span>
            </div>

            <div class="top-line"></div>

        </header>


        <!-- Marco de la cámara -->
        <section class="camera-area">

            <div class="camera-frame">

                <!-- Este espacio está completamente transparente -->
                <div class="transparent-window"></div>

                <img
                    class="camera-rune camera-rune-left"
                    src="assets/runes/agreynn-rune.svg"
                    alt=""
                >

                <img
                    class="camera-rune camera-rune-right"
                    src="assets/runes/agreynn-rune.svg"
                    alt=""
                >

                <img
                    class="camera-feather"
                    src="assets/feathers/plumapoints.png"
                    alt=""
                >

                <img
                    class="camera-fog"
                    src="assets/fog/fog-v1.svg"
                    alt=""
                >

            </div>

            <div class="camera-label">
                EL CUERVO OBSERVA
            </div>

        </section>


        <!-- Marco para el chat predeterminado -->
        <aside class="chat-area">

            <div class="chat-header">

                <img
                    src="assets/runes/agreynn-rune.svg"
                    alt=""
                >

                <span>LA BANDADA</span>

                <img
                    src="assets/runes/agreynn-rune.svg"
                    alt=""
                >

            </div>

            <!-- Este espacio también queda transparente -->
            <div class="chat-window"></div>

        </aside>


        <!-- Barra inferior -->
        <footer class="bottom-bar">

            <div class="bottom-decoration"></div>

            <p>
                ENTRE LA NIEBLA, LA BANDADA SE REÚNE
            </p>

            <div class="bottom-decoration"></div>

        </footer>


        <!-- Decoraciones generales -->
        <img
            class="fog fog-left"
            src="assets/fog/fog-v1.svg"
            alt=""
        >

        <img
            class="fog fog-right"
            src="assets/fog/fog-v1.svg"
            alt=""
        >

        <img
            class="feather feather-left"
            src="assets/feathers/plumapoints.png"
            alt=""
        >

        <img
            class="feather feather-right"
            src="assets/feathers/plumapoints.png"
            alt=""
        >

    </main>

    <script src="script.js"></script>

</body>
</html>
