<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Agreynn BRB</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="scene">

    <!-- Fondo -->
    <div class="background">
  <img 
  class="stone-texture" src="assets/textures/stone-v1.svg" alt="" />
</div>
    

    <!-- Capas oscuras y brillo -->
    <div class="dark-overlay"></div>
    <div class="purple-glow"></div>
    <!-- glow -->
    <img
  class="glow-image"
  src="assets/glow/purple-glow-v1.svg"
  alt=""
/>

    <!-- Niebla -->
    <img
      class="fog fog-back"
      src="assets/fog/fog-v1.svg"
      alt=""
    />

    <img
      class="fog fog-front"
      src="assets/fog/fog-v1.svg"
      alt=""
    />

    <!-- Plumas -->
    <img
      class="feather feather-one"
      src="assets/feathers/plumapoints.png"
      alt=""
    />

    <img
      class="feather feather-two"
      src="assets/feathers/plumapoints.png"
      alt=""
    />

    <img
      class="feather feather-three"
      src="assets/feathers/plumapoints.png"
      alt=""
    />

    <img
      class="feather feather-four"
      src="assets/feathers/plumapoints.png"
      alt=""
    />

    <!-- Texto -->
    <section class="center-content">

      <h1>AGREYNN</h1>

      <p class="brb-title">EL CUERVO REGRESARÁ...</p>

      <span id="scene-message">
        La niebla guarda este lugar.
      </span>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
