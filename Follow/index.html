<!DOCTYPE html>
<html lang="es">
<head>

  <title>Agreynn Follow Alert</title>

</head>

      <div id="username" class="alert-username">Agreynn</div>
      <div class="alert-subtitle">SE UNE A LA BANDADA</div>
    </div>

    <img class="feather feather-one" src="assets/feathers/feather-main.svg" alt="" />
    <img class="feather feather-two" src="assets/feathers/feather-main.svg" alt="" />
    <img class="feather feather-three" src="assets/feathers/feather-main.svg" alt="" />

    <img class="fog fog-back" src="assets/fog/fog-v1.svg" alt="" />
    <img class="fog fog-front" src="assets/fog/fog-v1.svg" alt="" />

  </div>
</body>
</html>
